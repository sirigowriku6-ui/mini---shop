<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Shop</title>
<style>
  body{font-family:system-ui;max-width:1000px;margin:auto;padding:16px;background:#f6f6f6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{border:1px solid #ddd;border-radius:12px;padding:12px;background:#fff}
  .card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
  button{padding:8px 12px;border-radius:8px;border:0;background:#0b5cff;color:#fff;margin:2px;cursor:pointer}
  input{padding:10px;width:100%;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box}
</style>
</head>
<body>

<h1>Mini Shop</h1>
<p>Demo store - no real payment.</p>

<input id="search" placeholder="Search products..." oninput="render()">

<div style="margin-bottom:12px">
  <button onclick="setFilter('All')">All</button>
  <button onclick="setFilter('Stationery')">Stationery</button>
  <button onclick="setFilter('Home')">Home</button>
  <button onclick="setFilter('Electronics')">Electronics</button>
  <button onclick="setFilter('Bags')">Bags</button>
  <button onclick="setFilter('Fashion')">Fashion</button>
</div>

<div id="products" class="grid"></div>

<h2>Cart (<span id="count">0</span> items)</h2>
<div id="cart"></div>
<h3>Total: <span id="total">₹0</span></h3>
<button onclick="checkout.showModal()">Checkout Preview</button>

<dialog id="checkout">
  <h3>Order Summary</h3>
  <div id="summary"></div>
  <p><b>Demo only - No payment taken</b></p>
  <button onclick="checkout.close()">Close</button>
</dialog>

<script>
const products = [
  {id:1, name:"Notebook", price:120, category:"Stationery", img:"https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=400"},
  {id:2, name:"Pen Pack", price:80, category:"Stationery", img:"https://images.unsplash.com/photo-1585336261022-680e295ce3fe?w=400"},
  {id:3, name:"Desk Lamp", price:650, category:"Home", img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400"},
  {id:4, name:"Water Bottle", price:299, category:"Home", img:"https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400"},
  {id:5, name:"Headphones", price:999, category:"Electronics", img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},
  {id:6, name:"Mouse Pad", price:149, category:"Electronics", img:"https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=400"},
  {id:7, name:"Backpack", price:899, category:"Bags", img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"},
  {id:8, name:"T-Shirt", price:499, category:"Fashion", img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"}
];

let cart = {};
try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e) { cart = {}; }
let currentFilter = "All";
const fmt = n => "₹" + n.toLocaleString("en-IN");

function save(){ localStorage.setItem("cart", JSON.stringify(cart)); render(); }
function addToCart(id){ cart[id] = (cart[id] || 0) + 1; save(); }
function changeQuantity(id, delta){ cart[id] = (cart[id] || 0) + delta; if(cart[id] <= 0) delete cart[id]; save(); }
function removeItem(id){ delete cart[id]; save(); }
function setFilter(c){ currentFilter = c; render(); }

function totals(){
  let subtotal = 0;
  for(let id in cart){
    let p = products.find(x => x.id == id);
    if(p) subtotal += p.price * cart[id];
  }
  let delivery = (subtotal > 0 && subtotal < 500) ? 40 : 0;
  return { subtotal, delivery, total: subtotal + delivery };
}

function render(){
  let q = document.getElementById("search").value.toLowerCase();
  let filtered = products.filter(p => (currentFilter === "All" || p.category === currentFilter) && p.name.toLowerCase().includes(q));

  let grid = document.getElementById("products");
  if(filtered.length === 0){
    grid.innerHTML = "<p>No products found</p>";
  } else {
    let html = "";
    for(let p of filtered){
      html += '<div class="card"><img src="' + p.img + '" alt="' + p.name + '"><h3>' + p.name + '</h3><p>' + p.category + ' - ' + fmt(p.price) + '</p><button onclick="addToCart(' + p.id + ')">Add to Cart</button></div>';
    }
    grid.innerHTML = html;
  }

  let cartEl = document.getElementById("cart");
  let keys = Object.keys(cart);
  if(keys.length === 0){
    cartEl.innerHTML = "<p>Cart is empty</p>";
  } else {
    let html = "";
    for(let id of keys){
      let p = products.find(x => x.id == id);
      if(!p) continue;
      html += '<div class="card"><b>' + p.name + '</b> - ' + fmt(p.price) + '<br><button onclick="changeQuantity(' + p.id + ',-1)">-</button> ' + cart[id] + ' <button onclick="changeQuantity(' + p.id + ',1)">+</button> <button onclick="removeItem(' + p.id + ')">Remove</button></div>';
    }
    cartEl.innerHTML = html;
  }

  let t = totals();
  let count = 0;
  for(let k in cart) count += cart[k];
  document.getElementById("count").textContent = count;
  document.getElementById("total").textContent = fmt(t.total);

  let s = "";
  for(let id of keys){
    let p = products.find(x => x.id == id);
    if(p) s += "<p>" + p.name + " x " + cart[id] + " = " + fmt(p.price * cart[id]) + "</p>";
  }
  s += "<p>Subtotal: " + fmt(t.subtotal) + "</p><p>Delivery: " + fmt(t.delivery) + "</p><p><b>Total: " + fmt(t.total) + "</b></p>";
  document.getElementById("summary").innerHTML = s;
}

render();
</script>
</body>
</html>
