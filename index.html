<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Shop</title>
<style>
body{font-family:system-ui;max-width:1000px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{border:1px solid #ddd;border-radius:12px;padding:12px;background:#fff}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
button{padding:8px 12px;border-radius:8px;border:0;background:#0b5cff;color:#fff;margin:2px}
input{padding:10px;width:100%;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box}
</style>
</head>
<body>
<h1>Mini Shop</h1>
<p>Demo store - no real payment.</p>
<input id="search" placeholder="Search products..." oninput="render()">
<div style="margin-bottom:12px">
<button onclick="setFilter('All')">All</button>
<button onclick="setFilter('Stationery')">Stationery</button>
<button onclick="setFilter('Home')">Home</button>
<button onclick="setFilter('Electronics')">Electronics</button>
<button onclick="setFilter('Bags')">Bags</button>
<button onclick="setFilter('Fashion')">Fashion</button>
</div>
<div id="products" class="grid"></div>
<h2>Cart (<span id="count">0</span> items)</h2>
<div id="cart"></div>
<h3>Total: <span id="total">₹0</span></h3>
<button onclick="checkout.showModal()">Checkout Preview</button>
<dialog id="checkout">
<h3>Order Summary</h3>
<div id="summary"></div>
<p><b>Demo only - No payment taken</b></p>
<button onclick="checkout.close()">Close</button>
</dialog>
